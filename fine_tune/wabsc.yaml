program: sweep_run.py      # your training script
method: bayes               # or "random" or "grid"

metric:
  name: eval/val_accuracy    # name of the metric you log
  goal: maximize            # or "minimize"

parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 1e-6
    max: 3e-4

  batch_size:
    values: [8, 16, 32]

  r:  # LoRA rank sweep
    values: [16, 32]

  lora_alpha:
    values: [32, 64]

  lora_dropout:
    values: [0.0, 0.05, 0.1]

#  kl_penalty:
#    distribution: log_uniform_values
#    min: 0.01
#    max: 0.3
